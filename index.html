<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carr Hill Trading</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0b0f;
    color: white;
}

header {
    background: linear-gradient(135deg, #8b0000, #3d0000);
    padding: 25px;
    text-align: center;
    border-bottom: 3px solid #ff3030;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header p {
    margin: 8px 0 0;
    color: #ddd;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

/* SCHOOL STATUS */

.status {
    text-align: center;
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 12px;
    font-weight: bold;
    background: #18181d;
    border: 1px solid #333;
}

.in-school {
    color: #55ff88;
}

.out-school {
    color: #ff5555;
}

/* TRADE */

.trade-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

@media (max-width: 700px) {
    .trade-container {
        grid-template-columns: 1fr;
    }
}

.trade-box {
    background: #151519;
    border: 1px solid #333;
    border-radius: 15px;
    padding: 20px;
}

.trade-box h2 {
    margin-top: 0;
}

.items {
    min-height: 150px;
}

.item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #202027;
    border: 1px solid #36363f;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 8px;
}

.item-name {
    font-weight: bold;
}

.item-price {
    color: #aaa;
    font-size: 13px;
    margin-top: 3px;
}

.remove {
    background: #8b0000;
    color: white;
    border: 0;
    border-radius: 7px;
    padding: 7px 10px;
    cursor: pointer;
}

.remove:hover {
    background: #c00000;
}

/* ADD ITEM */

.add-area {
    display: grid;
    grid-template-columns: 1fr 80px 70px;
    gap: 7px;
    margin-top: 15px;
}

select,
input {
    background: #0b0b0f;
    color: white;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 10px;
    min-width: 0;
}

button {
    cursor: pointer;
}

.add-button {
    background: #b00000;
    color: white;
    border: 0;
    border-radius: 8px;
    font-weight: bold;
}

.add-button:hover {
    background: #e00000;
}

/* TOTALS */

.total {
    margin-top: 18px;
    font-size: 28px;
    font-weight: bold;
}

.total-label {
    font-size: 13px;
    color: #999;
}

/* RESULT */

.result {
    margin-top: 20px;
    text-align: center;
    background: #151519;
    border: 1px solid #333;
    border-radius: 15px;
    padding: 20px;
}

.result-title {
    font-size: 24px;
    font-weight: bold;
}

.difference {
    margin-top: 8px;
    color: #aaa;
}

/* VALUES */

.values {
    margin-top: 25px;
    background: #151519;
    border: 1px solid #333;
    border-radius: 15px;
    padding: 20px;
}

.values h2 {
    margin-top: 0;
}

.value-row {
    display: flex;
    justify-content: space-between;
    padding: 12px 5px;
    border-bottom: 1px solid #292930;
}

.value-row:last-child {
    border-bottom: 0;
}

.school-price {
    color: #55ff88;
}

.out-price {
    color: #ff7777;
}

.unavailable {
    color: #666;
    text-decoration: line-through;
}
</style>
</head>

<body>

<header>
    <h1>🏫 Carr Hill Trading</h1>
    <p>School Item Trade Calculator</p>
</header>

<div class="container">

    <div id="status" class="status"></div>

    <div class="trade-container">

        <!-- YOUR SIDE -->

        <div class="trade-box">

            <h2>👤 Your Offer</h2>

            <div id="yourItems" class="items">
                <p style="color:#777;">No items added</p>
            </div>

            <div class="add-area">

                <select id="yourSelect"></select>

                <input
                    id="yourQuantity"
                    type="number"
                    min="1"
                    max="99"
                    value="1"
                >

                <button
                    class="add-button"
                    onclick="addYourItem()">
                    ADD
                </button>

            </div>

            <div class="total-label">YOUR VALUE</div>
            <div id="yourTotal" class="total">£0.00</div>

        </div>


        <!-- THEIR SIDE -->

        <div class="trade-box">

            <h2>🤝 Their Offer</h2>

            <div id="theirItems" class="items">
                <p style="color:#777;">No items added</p>
            </div>

            <div class="add-area">

                <select id="theirSelect"></select>

                <input
                    id="theirQuantity"
                    type="number"
                    min="1"
                    max="99"
                    value="1"
                >

                <button
                    class="add-button"
                    onclick="addTheirItem()">
                    ADD
                </button>

            </div>

            <div class="total-label">THEIR VALUE</div>
            <div id="theirTotal" class="total">£0.00</div>

        </div>

    </div>


    <!-- RESULT -->

    <div class="result">

        <div id="resultTitle" class="result-title">
            Add items to calculate the trade
        </div>

        <div id="difference" class="difference"></div>

    </div>


    <!-- ITEM VALUES -->

    <div class="values">

        <h2>📋 Item Values</h2>

        <div id="valueList"></div>

    </div>

</div>


<script>

/* ==========================================
   CARR HILL ITEMS

   [name, school price, outside price]
   ========================================== */

const items = [

    {
        name: "Radnor Fizz",
        school: 1.20,
        outside: 1.00
    },

    {
        name: "Sausage Rolls",
        school: 2.90,
        outside: 1.50
    },

    {
        name: "Mini Doughnuts",
        school: 1.20,
        outside: 2.00
    },

    {
        name: "Radnor Splash",
        school: 2.00,
        outside: 1.50
    },

    {
        name: "Radnor Fruits",
        school: 1.00,
        outside: 0.50
    },

    {
        name: "Milkshakes",
        school: 1.50,
        outside: 2.00
    },

    {
        name: "50p 2 Litre Coke Bottle",
        school: 1.00,
        outside: 0.70
    },

    {
        name: "Popcorn",
        school: 1.10,
        outside: 1.00
    }

];


/* ==========================================
   TRADE ARRAYS
   ========================================== */

let yourTrade = [];
let theirTrade = [];


/* ==========================================
   CHECK SCHOOL TIME
   ========================================== */

function isSchoolTime() {

    const now = new Date();

    const day = now.getDay();

    const hour = now.getHours();

    const minute = now.getMinutes();

    const currentMinutes =
        hour * 60 + minute;


    /*
       Monday = 1
       Friday = 5

       School market:
       08:30 → 15:30
    */

    if (day >= 1 && day <= 5) {

        if (
            currentMinutes >= 510 &&
            currentMinutes <= 930
        ) {

            return true;

        }

    }

    return false;

}


/* ==========================================
   GET CURRENT PRICE
   ========================================== */

function getPrice(item) {

    if (isSchoolTime()) {

        return item.school;

    }

    return item.outside;

}


/* ==========================================
   FORMAT MONEY
   ========================================== */

function money(amount) {

    return "£" + amount.toFixed(2);

}


/* ==========================================
   CREATE SELECT MENUS
   ========================================== */

function createMenus() {

    const yourSelect =
        document.getElementById("yourSelect");

    const theirSelect =
        document.getElementById("theirSelect");


    items.forEach((item, index) => {

        const option1 =
            document.createElement("option");

        option1.value = index;

        option1.textContent =
            item.name +
            " — " +
            money(getPrice(item));

        yourSelect.appendChild(option1);


        const option2 =
            document.createElement("option");

        option2.value = index;

        option2.textContent =
            item.name +
            " — " +
            money(getPrice(item));

        theirSelect.appendChild(option2);

    });

}


/* ==========================================
   ADD TO YOUR TRADE
   ========================================== */

function addYourItem() {

    const select =
        document.getElementById("yourSelect");

    const quantityInput =
        document.getElementById("yourQuantity");


    const index =
        Number(select.value);

    let quantity =
        Number(quantityInput.value);


    if (!Number.isFinite(quantity)) {
        quantity = 1;
    }


    quantity =
        Math.max(
            1,
            Math.min(99, Math.floor(quantity))
        );


    yourTrade.push({

        index: index,
        quantity: quantity

    });


    render();

}


/* ==========================================
   ADD TO THEIR TRADE
   ========================================== */

function addTheirItem() {

    const select =
        document.getElementById("theirSelect");

    const quantityInput =
        document.getElementById("theirQuantity");


    const index =
        Number(select.value);

    let quantity =
        Number(quantityInput.value);


    if (!Number.isFinite(quantity)) {
        quantity = 1;
    }


    quantity =
        Math.max(
            1,
            Math.min(99, Math.floor(quantity))
        );


    theirTrade.push({

        index: index,
        quantity: quantity

    });


    render();

}


/* ==========================================
   REMOVE ITEM
   ========================================== */

function removeYourItem(index) {

    yourTrade.splice(index, 1);

    render();

}


function removeTheirItem(index) {

    theirTrade.splice(index, 1);

    render();

}


/* ==========================================
   CALCULATE TOTAL
   ========================================== */

function calculateTotal(trade) {

    let total = 0;


    trade.forEach(entry => {

        const item =
            items[entry.index];

        total +=
            getPrice(item) *
            entry.quantity;

    });


    return total;

}


/* ==========================================
   RENDER TRADE
   ========================================== */

function renderTrade(
    trade,
    elementID,
    removeFunction
) {

    const container =
        document.getElementById(elementID);


    container.innerHTML = "";


    if (trade.length === 0) {

        container.innerHTML =
            '<p style="color:#777;">No items added</p>';

        return;

    }


    trade.forEach((entry, index) => {

        const item =
            items[entry.index];

        const currentPrice =
            getPrice(item);


        const row =
            document.createElement("div");

        row.className = "item";


        row.innerHTML = `

            <div>

                <div class="item-name">
                    ${item.name}
                </div>

                <div class="item-price">

                    ${money(currentPrice)}
                    ×
                    ${entry.quantity}

                </div>

            </div>

            <button
                class="remove"
                onclick="${removeFunction}(${index})">

                ×

            </button>

        `;


        container.appendChild(row);

    });

}


/* ==========================================
   UPDATE STATUS
   ========================================== */

function updateStatus() {

    const status =
        document.getElementById("status");


    if (isSchoolTime()) {

        status.className =
            "status in-school";

        status.innerHTML =
            "📈 IN SCHOOL — SCHOOL PRICES ACTIVE";

    } else {

        status.className =
            "status out-school";

        status.innerHTML =
            "📉 OUT OF SCHOOL — OUTSIDE PRICES ACTIVE";

    }

}


/* ==========================================
   UPDATE ITEM VALUE LIST
   ========================================== */

function updateValues() {

    const list =
        document.getElementById("valueList");


    list.innerHTML = "";


    items.forEach(item => {

        const row =
            document.createElement("div");

        row.className =
            "value-row";


        row.innerHTML = `

            <span>
                ${item.name}
            </span>

            <span>

                <span class="school-price">
                    ${money(item.school)}
                </span>

                /
                <span class="out-price">
                    ${money(item.outside)}
                </span>

            </span>

        `;


        list.appendChild(row);

    });


    const fruitPots =
        document.createElement("div");

    fruitPots.className =
        "value-row";


    fruitPots.innerHTML = `

        <span class="unavailable">
            Fruit Pots
        </span>

        <span class="unavailable">
            UNAVAILABLE
        </span>

    `;


    list.appendChild(fruitPots);

}


/* ==========================================
   MAIN RENDER
   ========================================== */

function render() {

    renderTrade(
        yourTrade,
        "yourItems",
        "removeYourItem"
    );


    renderTrade(
        theirTrade,
        "theirItems",
        "removeTheirItem"
    );


    const yourTotal =
        calculateTotal(yourTrade);

    const theirTotal =
        calculateTotal(theirTrade);


    document.getElementById("yourTotal")
        .textContent =
        money(yourTotal);


    document.getElementById("theirTotal")
        .textContent =
        money(theirTotal);


    const resultTitle =
        document.getElementById("resultTitle");

    const difference =
        document.getElementById("difference");


    if (
        yourTrade.length === 0 &&
        theirTrade.length === 0
    ) {

        resultTitle.textContent =
            "Add items to calculate the trade";

        difference.textContent = "";

        return;

    }


    const diff =
        Math.abs(yourTotal - theirTotal);


    if (diff < 0.25) {

        resultTitle.textContent =
            "⚖️ VERY CLOSE TRADE";

    } else if (yourTotal > theirTotal) {

        resultTitle.textContent =
            "📈 YOUR OFFER IS WORTH MORE";

    } else {

        resultTitle.textContent =
            "📈 THEIR OFFER IS WORTH MORE";

    }


    difference.textContent =
        "Difference: " + money(diff);

}


/* ==========================================
   UPDATE EVERYTHING EVERY 30 SECONDS
   ========================================== */

function updateEverything() {

    updateStatus();

    updateValues();

    render();

}


/* START */

createMenus();

updateEverything();


/*
   Recalculate automatically so prices
   change when school hours begin/end.
*/

setInterval(updateEverything, 30000);

</script>

</body>
</html>
