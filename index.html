<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carr Hill Trading</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #090909;
    color: white;
}

header {
    background: linear-gradient(135deg, #8b0000, #300000);
    padding: 25px;
    text-align: center;
    border-bottom: 2px solid #ff2020;
}

header h1 {
    font-size: 32px;
}

header p {
    color: #ffb0b0;
    margin-top: 6px;
}

.balance {
    margin: 20px auto;
    max-width: 1000px;
    background: #151515;
    border: 1px solid #333;
    border-radius: 15px;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.money {
    font-size: 28px;
    font-weight: bold;
    color: #55ff88;
}

.status {
    padding: 8px 14px;
    border-radius: 20px;
    background: #222;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.market {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
    gap: 20px;
}

.card {
    background: #151515;
    border: 1px solid #333;
    border-radius: 15px;
    padding: 20px;
    transition: 0.2s;
}

.card:hover {
    transform: translateY(-3px);
    border-color: #ff3030;
}

.item-name {
    font-size: 22px;
    font-weight: bold;
}

.price {
    font-size: 32px;
    margin: 15px 0 5px;
}

.change {
    margin-bottom: 15px;
}

.up {
    color: #55ff88;
}

.down {
    color: #ff5555;
}

.holdings {
    color: #aaa;
    margin-bottom: 15px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 18px;
    font-weight: bold;
    cursor: pointer;
    margin-right: 6px;
}

.buy {
    background: #20b957;
    color: white;
}

.sell {
    background: #d62d2d;
    color: white;
}

.buy:hover {
    background: #29d66a;
}

.sell:hover {
    background: #ff3b3b;
}

.panel {
    margin-top: 25px;
    background: #151515;
    border: 1px solid #333;
    border-radius: 15px;
    padding: 20px;
}

.panel h2 {
    margin-bottom: 15px;
}

input {
    width: 100%;
    background: #090909;
    color: white;
    border: 1px solid #444;
    padding: 12px;
    border-radius: 8px;
    margin: 7px 0;
}

.add {
    background: #8b0000;
    color: white;
    margin-top: 8px;
}

.reset {
    background: #333;
    color: white;
}

footer {
    text-align: center;
    padding: 30px;
    color: #666;
}
</style>
</head>

<body>

<header>
    <h1>🏫 Carr Hill Trading</h1>
    <p>THE SCHOOL MARKET</p>
</header>

<div class="balance">
    <div>
        <div>Virtual Balance</div>
        <div class="money" id="balance">£100.00</div>
    </div>

    <div class="status" id="schoolStatus">
        Checking market...
    </div>
</div>

<div class="container">

    <div class="market" id="market"></div>

    <div class="panel">
        <h2>➕ Add Item</h2>

        <input id="itemName" placeholder="Item name e.g. Radnor Orange">
        <input id="itemPrice" type="number" step="0.01" placeholder="Starting price (£)">

        <button class="add" onclick="addItem()">Add Item</button>
        <button class="reset" onclick="resetGame()">Reset Game</button>
    </div>

</div>

<footer>
    Carr Hill Trading • Virtual Market Simulation
</footer>

<script>

let balance = Number(localStorage.getItem("balance")) || 100;

let items = JSON.parse(localStorage.getItem("items")) || [
    {
        name: "Radnor Fizz",
        price: 1.20,
        basePrice: 1.20,
        owned: 0,
        change: 0
    },
    {
        name: "Radnor Orange",
        price: 1.10,
        basePrice: 1.10,
        owned: 0,
        change: 0
    },
    {
        name: "Radnor Lemon",
        price: 1.10,
        basePrice: 1.10,
        owned: 0,
        change: 0
    }
];

function save() {
    localStorage.setItem("balance", balance);
    localStorage.setItem("items", JSON.stringify(items));
}

function isSchoolTime() {

    const now = new Date();
    const day = now.getDay();
    const hour = now.getHours();
    const minute = now.getMinutes();

    // Monday-Friday
    if (day < 1 || day > 5) return false;

    const time = hour * 60 + minute;

    // 08:30 - 15:30
    return time >= 510 && time <= 930;
}

function updatePrices() {

    const school = isSchoolTime();

    items.forEach(item => {

        /*
        During school:
        prices generally rise.

        Outside school:
        prices generally fall.

        Random movement keeps the market changing.
        */

        let movement;

        if (school) {
            movement = Math.random() * 0.08 + 0.01;
        } else {
            movement = -(Math.random() * 0.06 + 0.005);
        }

        item.price += movement;

        // Don't let prices go below 10p
        if (item.price < 0.10) {
            item.price = 0.10;
        }

        // Round to pennies
        item.price = Math.round(item.price * 100) / 100;

        item.change = ((item.price - item.basePrice) / item.basePrice) * 100;
    });

    save();
    render();
}

function buy(index) {

    const item = items[index];

    if (balance >= item.price) {

        balance -= item.price;
        item.owned++;

        save();
        render();

    } else {
        alert("You don't have enough virtual money! 💷");
    }
}

function sell(index) {

    const item = items[index];

    if (item.owned > 0) {

        balance += item.price;
        item.owned--;

        save();
        render();

    } else {
        alert("You don't own any of this item!");
    }
}

function addItem() {

    const name = document.getElementById("itemName").value.trim();
    const price = Number(document.getElementById("itemPrice").value);

    if (!name || !price || price <= 0) {
        alert("Enter an item name and valid price.");
        return;
    }

    items.push({
        name: name,
        price: price,
        basePrice: price,
        owned: 0,
        change: 0
    });

    document.getElementById("itemName").value = "";
    document.getElementById("itemPrice").value = "";

    save();
    render();
}

function resetGame() {

    if (!confirm("Reset your entire virtual market?")) return;

    localStorage.clear();

    location.reload();
}

function render() {

    document.getElementById("balance").textContent =
        "£" + balance.toFixed(2);

    const school = isSchoolTime();

    document.getElementById("schoolStatus").innerHTML =
        school
        ? "📈 SCHOOL MARKET — PRICES RISING"
        : "📉 AFTER HOURS — PRICES FALLING";

    const market = document.getElementById("market");

    market.innerHTML = "";

    items.forEach((item, index) => {

        const changeClass = item.change >= 0 ? "up" : "down";

        const arrow = item.change >= 0 ? "▲" : "▼";

        market.innerHTML += `
            <div class="card">

                <div class="item-name">
                    ${escapeHTML(item.name)}
                </div>

                <div class="price">
                    £${item.price.toFixed(2)}
                </div>

                <div class="change ${changeClass}">
                    ${arrow} ${Math.abs(item.change).toFixed(1)}%
                </div>

                <div class="holdings">
                    You own: <strong>${item.owned}</strong>
                </div>

                <button class="buy" onclick="buy(${index})">
                    BUY
                </button>

                <button class="sell" onclick="sell(${index})">
                    SELL
                </button>

            </div>
        `;
    });
}

function escapeHTML(text) {

    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

// Render immediately
render();

// Change prices every 30 seconds
setInterval(updatePrices, 30000);

// Update school status every minute
setInterval(render, 60000);

</script>

</body>
</html>
